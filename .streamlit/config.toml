# 화면 테마 — 따뜻한 한식 톤. 밝은 모드와 어두운 모드를 따로 정의한다.
#
# `base`를 정하지 않는 것이 중요하다. 정해버리면 보는 사람의 설정을 무시하고 한쪽으로
# 고정된다. 아래처럼 두 벌을 주면 각자의 기기 설정을 따라간다.
#
# 주의: 웹 Space의 Dockerfile이 `COPY app.py .`로 app.py만 복사한다. 이 파일이
# 배포에 실리려면 그쪽에 `.streamlit` 복사를 한 줄 더해야 한다(없어도 앱은 뜬다 —
# 테마만 기본값이 된다).

[theme.light]
primaryColor = "#C0392B"            # 고추장 빨강
backgroundColor = "#FFFCF7"         # 따뜻한 흰색
secondaryBackgroundColor = "#F5EDE3"
textColor = "#2B2320"

[theme.dark]
primaryColor = "#E2725B"            # 어두운 배경에서도 읽히는 테라코타
backgroundColor = "#171310"
secondaryBackgroundColor = "#221C18"
textColor = "#F3EDE7"
